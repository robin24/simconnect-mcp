[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simconnect-mcp"
version = "0.1.0"
description = "MCP server for MSFS SimConnect — add-on development companion"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp[cli]>=1.26,<2",
    "SimConnect>=0.4.26",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
simconnect-mcp = "simconnect_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/simconnect_mcp"]
artifacts = ["src/simconnect_mcp/data/*.json", "src/simconnect_mcp/docs/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: requires a running MSFS instance with an aircraft loaded (deselected by default)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
